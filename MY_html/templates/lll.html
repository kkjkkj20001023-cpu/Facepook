<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram</title>
  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #fff;
      color: #000;
    }

    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f5f5f5;
    }

    .login-box {
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-box h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #000;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #0095f6;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .login-box button:hover {
      background-color: #0077cc;
    }

    .login-box .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #999;
      text-align: center;
    }

    .login-box .footer a {
      color: #0095f6;
      text-decoration: none;
    }

    .login-box .footer a:hover {
      text-decoration: underline;
    }

    .logo {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo img {
      height: 30px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo">
        <img src="https://www.instagram.com/static/images/ico/ig-logo.png/624507068651.png" alt="Instagram Logo">
        <span>Instagram</span>
      </div>
      <h2>Log in</h2>
      <form onsubmit="handleLogin(event)">
        <input type="text" id="username" placeholder="Phone number, username, or email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Log in</button>
        <div class="footer">
          <a href="#">Forgot password?</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      // Simulate login
      alert("Logged in as " + username);
      // You can add more logic here, like redirecting to a fake profile page
    }
  </script>
</body>
</html>
